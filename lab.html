<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Lab — LoRAs & generative explorations · AshmoTV</title>
  <meta name="description" content="Custom-trained WAN, Qwen and Flux LoRAs, ComfyUI workflows and generative video explorations by Ashish G. (AshmoTV)." />
  <meta name="theme-color" content="#07070a" />
  <script>try{if(sessionStorage.getItem("ashmo-pt"))document.documentElement.classList.add("pt-in")}catch(e){}</script>
  <script>/* apply the visitor's saved theme before first paint */
    (function(){var d=document.documentElement,t={};try{t=JSON.parse(localStorage.getItem('ashmo-theme')||'{}')}catch(e){}
    d.dataset.mode=t.mode==='light'?'light':'dark';d.dataset.accent=['acid','ion','uv'].indexOf(t.accent)>-1?t.accent:'ember';
    if(t.mode==='light'){var m=document.querySelector('meta[name=theme-color]');m&&m.setAttribute('content','#f1ede4')}})();</script>
  <script>/* this site has no service worker: remove any left on this origin by another local app */
    try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})});window.caches&&caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}catch(e){}</script>
  <meta property="og:title" content="AI Lab — LoRAs & generative explorations · AshmoTV" />
  <meta property="og:description" content="Motion design, creative production and custom-trained AI models." />
  <meta property="og:image" content="brand/og.jpg" />
  <link rel="icon" href="brand/favicon.png" />
</head>
